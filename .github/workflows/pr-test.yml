name: Test Issue Transfer Action
on:
  pull_request:

permissions:
  contents: read

jobs:
  test-action:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked production dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Test action without GitHub writes
        run: npm test
